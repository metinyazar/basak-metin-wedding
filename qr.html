<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Başak &amp; Metin · QR Kart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Quicksand', sans-serif;
      color: #4a3f55;
      background: #ece3f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 360px;
      background: #fffdfa;
      border-radius: 22px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(123,79,158,.22);
      border: 2px solid #efe6f7;
    }
    .vines { font-size: 22px; letter-spacing: 4px; opacity: .7; }
    .kicker { font-family: 'Parisienne', cursive; font-size: 2rem; color: #7b4f9e; margin-top: 4px; }
    .names  { font-family: 'Parisienne', cursive; font-size: 2.4rem; color: #e07b3e; line-height: 1.1; margin: 2px 0 4px; }
    .date   { letter-spacing: 2px; color: #e07b3e; font-weight: 600; font-size: .95rem; }
    .venue  { color: #4f7a4a; font-size: .8rem; letter-spacing: 1px; margin-bottom: 18px; }
    .qr     { width: 230px; height: 230px; display: block; margin: 0 auto; }
    .label  { color: #7b4f9e; font-weight: 600; margin-top: 14px; letter-spacing: 1px; }
    .url    { font-size: .72rem; opacity: .6; word-break: break-all; margin-top: 2px; }
    @media print {
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="vines">🌿🪻🌸 ✿ 🌸🌼🌿</div>
    <p class="kicker">Evleniyoruz</p>
    <p class="names">Başak &amp; Metin</p>
    <p class="date">4 Temmuz 2026 · 20:00</p>
    <p class="venue">Turkuaz Düğün Salonu · Söke</p>

    <img class="qr" src="qr.png" alt="Düğün sitesi QR kodu" />

    <p class="label">📷 Okutun → Düğün Sitemiz</p>
    <p class="url">metinyazar.github.io/basak-metin-wedding</p>
  </div>
</body>
</html>
